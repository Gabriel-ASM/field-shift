[project]
name = "field-shift"
version = "0.2.0"
description = "Field Shift backend: crop rotation scenarios over NASA Earth observations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymongo>=4.8",
    "jsonschema>=4.22",
    "referencing>=0.35",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "mongomock>=4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["field_shift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mongo: needs a real MongoDB (set FIELD_SHIFT_TEST_MONGO_URI)"]
