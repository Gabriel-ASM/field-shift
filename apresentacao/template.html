<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Shift — Carbono e Nitrogênio</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --ink:#1d2a24; --muted:#5d6b63; --line:#d9ddd5;
  --accent:#1f7a5a; --com:#2f6f9f; --cob:#5aa469; --warn:#b4540a; --warnbg:#fbeedd;
  --band:rgba(31,122,90,.16); --shade:rgba(0,0,0,.035); --leg:#c9822b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --panel:#18211e; --ink:#e8efe9; --muted:#9db0a5; --line:#2b3a34;
    --accent:#4cc79a; --com:#6bb0e0; --cob:#7fcf8e; --warn:#f0a35e; --warnbg:#2c2216;
    --band:rgba(76,199,154,.18); --shade:rgba(255,255,255,.035); --leg:#e6a64e;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --panel:#18211e; --ink:#e8efe9; --muted:#9db0a5; --line:#2b3a34;
  --accent:#4cc79a; --com:#6bb0e0; --cob:#7fcf8e; --warn:#f0a35e; --warnbg:#2c2216;
  --band:rgba(76,199,154,.18); --shade:rgba(255,255,255,.035); --leg:#e6a64e;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;font-weight:650;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5vw,3.4rem)} h2{font-size:clamp(1.5rem,3vw,2.2rem)} h3{font-size:1.05rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
p{margin:.4em 0}
.deck{height:100%;position:relative}
section{position:absolute;inset:0;padding:clamp(16px,3.2vw,44px) clamp(16px,5vw,72px) 74px;display:none;overflow:auto}
section.on{display:block}
.wrap{max-width:1180px;margin:0 auto}
.tag{display:inline-block;font:600 .72rem/1 ui-monospace,Menlo,monospace;padding:.35em .55em;border-radius:6px;background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.muted{color:var(--muted)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.big{font-size:clamp(1.6rem,3.2vw,2.5rem);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.unit{font-size:.9rem;color:var(--muted);font-weight:500}
.note{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:12px;padding:12px 16px;color:var(--ink)}
.note b{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:.12em .55em;border-radius:99px;font-size:.78rem;font-weight:600;border:1px solid var(--line)}
.pill.com{background:color-mix(in srgb,var(--com) 18%,transparent);color:var(--com);border-color:color-mix(in srgb,var(--com) 40%,transparent)}
.pill.cob{background:color-mix(in srgb,var(--cob) 20%,transparent);color:var(--cob);border-color:color-mix(in srgb,var(--cob) 45%,transparent)}
.leg{color:var(--leg);font-weight:700}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font:12px system-ui,sans-serif}
svg .t-ink{fill:var(--ink)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .gr{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:.8rem;white-space:nowrap;display:none;z-index:5;transform:translate(-50%,-110%)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
nav{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:12px;padding:0 clamp(12px,3vw,36px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10}
nav button{all:unset;cursor:pointer;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:.9rem}
nav button:hover{border-color:var(--accent)} nav button:focus-visible{outline:2px solid var(--accent)}
nav select{all:unset;cursor:pointer;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:.9rem}
nav select:focus-visible{outline:2px solid var(--accent)}
nav .dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
nav .dots span{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
nav .dots span.on{background:var(--accent);transform:scale(1.25)}
.cnt{color:var(--muted);font-size:.85rem;min-width:44px;text-align:right}
.hero{display:flex;flex-direction:column;justify-content:center;min-height:calc(100% - 20px)}
.bar-in{display:inline-block;height:10px;border-radius:5px;vertical-align:middle}
ul.tight{margin:.3em 0;padding-left:1.15em} ul.tight li{margin:.25em 0}
code{font:.85em ui-monospace,Menlo,monospace;background:var(--shade);padding:.1em .35em;border-radius:5px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<nav>
  <button id="prev" aria-label="Slide anterior">← Anterior</button>
  <div class="dots" id="dots"></div>
  <span class="cnt" id="cnt"></span>
  <button id="next" aria-label="Próximo slide">Próximo →</button>
  <select id="city" aria-label="Área"></select>
  <button id="theme" aria-label="Alternar tema">◐</button>
</nav>
<script>
const ALL = __DATA__;
const HM=location.hash.slice(1).match(/^([a-z]+)-(\d+)$/);
const KEY=(HM&&ALL.cidades[HM[1]])?HM[1]:ALL.ordem[0];
const D = ALL.cidades[KEY];
</script>
<script>
const fmt=(v,d=1)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=1)=>(v>0?'+':v<0?'−':'')+fmt(Math.abs(v),d);
const M=D.meta, S=M.solo, B=D.cenarios.base, LO=D.cenarios.baixo, HI=D.cenarios.alto, V=D.verificacao_equilibrio;
const LEG=new Set(['Soja','Feijão','Amendoim','Crotalária','Mucuna']);
const col=t=>t==='comercial'?'var(--com)':'var(--cob)';
const pts=(c,k,v0)=>[v0].concat(c.serie.map(r=>r[k]));
const TOC=[pts(LO,'toc',S.toc),pts(B,'toc',S.toc),pts(HI,'toc',S.toc)];
const NSO=[pts(LO,'n_som',S.n_estoque),pts(B,'n_som',S.n_estoque),pts(HI,'n_som',S.n_estoque)];
const BAL=[pts(LO,'bal_n',0),pts(B,'bal_n',0),pts(HI,'bal_n',0)];
const slots=B.slots;
const nm=D.cenarios.base.serie.length;

/* ---------- gráficos ---------- */
function nice(lo,hi,n=5){const r=hi-lo||1,st0=r/n,m=Math.pow(10,Math.floor(Math.log10(st0))),f=st0/m;const st=(f<1.5?1:f<3?2:f<7?5:10)*m;const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];for(let v=a;v<=b+st/2;v+=st)t.push(+v.toFixed(10));return{a,b,t,st}}
function lineChart(id,{series,yLabel,dec=1,hline,note,W=900,H=400,compact=false}){
  const l=compact?58:64,r=16,t=compact?24:74,b=34,iw=W-l-r,ih=H-t-b;
  const all=series.flatMap(s=>s.ys); let lo=Math.min(...all),hi=Math.max(...all);
  if(hline){lo=Math.min(lo,hline.y);hi=Math.max(hi,hline.y)}
  const ny=nice(lo,hi,5),x=i=>l+iw*i/nm,y=v=>t+ih*(1-(v-ny.a)/(ny.b-ny.a));
  let g='';
  slots.forEach((s,i)=>{const x0=x(s.mes_ini-1),x1=x(s.mes_fim);
    if(i%2===0)g+=`<rect x="${x0}" y="${t}" width="${x1-x0}" height="${ih}" fill="var(--shade)"/>`;
    g+=`<rect x="${x0}" y="${t-8}" width="${x1-x0}" height="4" fill="${col(s.tipo)}" rx="2"/>`;
    if(!compact)g+=`<text transform="translate(${(x0+x1)/2+4},${t-14}) rotate(-52)" class="t-ink" style="font-size:11px">${s.cultura.replace('-de-açúcar','').replace('-forrageiro','')}${LEG.has(s.cultura)?' ●':''}</text>`});
  ny.t.forEach(v=>{g+=`<line class="gr" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,dec)}</text>`});
  for(let m=0;m<=nm;m+=12){g+=`<line class="ax" x1="${x(m)}" x2="${x(m)}" y1="${t+ih}" y2="${t+ih+5}"/><text x="${x(m)}" y="${H-12}" text-anchor="middle">ano ${m/12}</text>`}
  const [lo_,mid,hi_]=series.length===3?series:[null,series[0],null];
  if(lo_&&hi_){const up=hi_.ys.map((v,i)=>`${x(i)},${y(Math.max(v,lo_.ys[i]))}`),dn=lo_.ys.map((v,i)=>`${x(i)},${y(Math.min(v,hi_.ys[i]))}`).reverse();g+=`<polygon points="${up.concat(dn).join(' ')}" fill="var(--band)"/>`}
  if(hline)g+=`<line x1="${l}" x2="${W-r}" y1="${y(hline.y)}" y2="${y(hline.y)}" stroke="var(--warn)" stroke-dasharray="6 5" stroke-width="1.5"/><text x="${W-r-4}" y="${y(hline.y)-6}" text-anchor="end" style="fill:var(--warn)">${hline.label}</text>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" points="${mid.ys.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
  g+=`<text x="14" y="${t+ih/2}" transform="rotate(-90 14 ${t+ih/2})" text-anchor="middle">${yLabel}</text><line id="${id}-cur" class="ax" y1="${t}" y2="${t+ih}" x1="0" x2="0" style="display:none;stroke:var(--ink)"/>`;
  const el=document.getElementById(id);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${yLabel}">${g}</svg><div class="tip"></div>`;
  const sv=el.querySelector('svg'),tip=el.querySelector('.tip'),cur=sv.querySelector(`#${id}-cur`);
  sv.addEventListener('mousemove',e=>{const rc=sv.getBoundingClientRect(),px=(e.clientX-rc.left)/rc.width*W;let i=Math.round((px-l)/iw*nm);i=Math.max(0,Math.min(nm,i));
    cur.setAttribute('x1',x(i));cur.setAttribute('x2',x(i));cur.style.display='';
    const rr=i?B.serie[i-1]:null,txt=[`mês ${i}`+(rr?` · ${rr.cultura}`:' · início'),`base ${fmt(mid.ys[i],dec)}`+(lo_?` (faixa ${fmt(Math.min(lo_.ys[i],hi_.ys[i]),dec)}–${fmt(Math.max(lo_.ys[i],hi_.ys[i]),dec)})`:'')].join(' — ');
    tip.textContent=txt;tip.style.display='block';tip.style.left=(x(i)/W*rc.width)+'px';tip.style.top='40px'});
  sv.addEventListener('mouseleave',()=>{tip.style.display='none';cur.style.display='none'});
}
function barChart(id,{rows,unit,dec=0,title,W=560,l=112}){
  const rh=31,r=54,t=28,H=t+rows.length*rh+22,iw=W-l-r;
  const ext=rows.flatMap(q=>[q.v,q.lo,q.hi,0]),ny=nice(Math.min(...ext),Math.max(...ext),5),x=v=>l+iw*(v-ny.a)/(ny.b-ny.a);
  let g='';ny.t.forEach(v=>{g+=`<line class="gr" x1="${x(v)}" x2="${x(v)}" y1="${t-6}" y2="${H-20}"/><text x="${x(v)}" y="${H-5}" text-anchor="middle">${fmt(v,dec)}</text>`});
  g+=`<line x1="${x(0)}" x2="${x(0)}" y1="${t-6}" y2="${H-20}" stroke="var(--ink)" stroke-width="1.4"/>`;
  rows.forEach((q,i)=>{const yy=t+i*rh,c=q.tipo?col(q.tipo):'var(--accent)',x0=x(0),x1=x(q.v);
    g+=`<text x="${l-10}" y="${yy+rh/2+4}" text-anchor="end" class="t-ink">${q.n}${LEG.has(q.n)?' <tspan class="leg">●</tspan>':''}</text>`;
    g+=`<rect x="${Math.min(x0,x1)}" y="${yy+5}" width="${Math.max(1,Math.abs(x1-x0))}" height="${rh-10}" fill="${c}" rx="3" opacity=".9"/>`;
    g+=`<line x1="${x(q.lo)}" x2="${x(q.hi)}" y1="${yy+rh/2}" y2="${yy+rh/2}" stroke="var(--ink)" stroke-width="1.3"/><line x1="${x(q.lo)}" x2="${x(q.lo)}" y1="${yy+8}" y2="${yy+rh-8}" stroke="var(--ink)"/><line x1="${x(q.hi)}" x2="${x(q.hi)}" y1="${yy+8}" y2="${yy+rh-8}" stroke="var(--ink)"/>`;
    g+=`<text x="${W-r+8}" y="${yy+rh/2+4}" class="t-ink" style="font-variant-numeric:tabular-nums">${sgn(q.v,dec)}</text>`});
  g+=`<text x="${l}" y="12">${title}</text>`;
  document.getElementById(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg>`;
}
function climChart(id){
  const C=M.clima,W=560,H=260,l=44,r=44,t=16,b=30,iw=W-l-r,ih=H-t-b,mes=['J','F','M','A','M','J','J','A','S','O','N','D'];
  const mx=Math.max(...C.chuva,...C.eto)*1.1,bw=iw/12,y=v=>t+ih*(1-v/mx),ty=v=>t+ih*(1-(v-10)/(30-10));
  let g='';[0,50,100,150,200].forEach(v=>{if(v<=mx)g+=`<line class="gr" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  C.chuva.forEach((v,i)=>{g+=`<rect x="${l+i*bw+5}" y="${y(v)}" width="${bw-10}" height="${t+ih-y(v)}" fill="var(--com)" opacity=".75" rx="2"/><text x="${l+i*bw+bw/2}" y="${H-10}" text-anchor="middle">${mes[i]}</text>`});
  g+=`<polyline fill="none" stroke="var(--warn)" stroke-width="2.2" points="${C.eto.map((v,i)=>`${l+i*bw+bw/2},${y(v)}`).join(' ')}"/>`;
  g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-dasharray="5 4" points="${C.tmean.map((v,i)=>`${l+i*bw+bw/2},${ty(v)}`).join(' ')}"/>`;
  [10,20,30].forEach(v=>g+=`<text x="${W-r+6}" y="${ty(v)+4}">${v}°</text>`);
  document.getElementById(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Clima mensal">${g}</svg>`;
}

const CCOL=['var(--accent)','var(--com)','var(--warn)','var(--leg)'];
function relLines(id){
  const W=900,H=330,l=60,r=100,t=16,b=32,iw=W-l-r,ih=H-t-b,S_=ALL.ordem.map(k=>{const c=ALL.cidades[k],b_=c.cenarios.base;return{n:c.meta.local,ys:pts(b_,'toc',c.meta.solo.toc).map(v=>100*v/c.meta.solo.toc)}});
  const lo=Math.min(...S_.flatMap(q=>q.ys)),ny=nice(lo,100,5),x=i=>l+iw*i/nm,y=v=>t+ih*(1-(v-ny.a)/(ny.b-ny.a));let g='';
  ny.t.forEach(v=>{g+=`<line class="gr" x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${fmt(v,0)}%</text>`});
  for(let m=0;m<=nm;m+=12)g+=`<text x="${x(m)}" y="${H-10}" text-anchor="middle">ano ${m/12}</text>`;
  S_.forEach((q,i)=>{g+=`<polyline fill="none" stroke="${CCOL[i%4]}" stroke-width="2.6" stroke-linejoin="round" points="${q.ys.map((v,j)=>`${x(j)},${y(v)}`).join(' ')}"/><text x="${W-r+6}" y="${y(q.ys[nm])+4}" style="fill:${CCOL[i%4]};font-weight:600">${q.n}</text>`});
  g+=`<text x="14" y="${t+ih/2}" transform="rotate(-90 14 ${t+ih/2})" text-anchor="middle">COS relativo ao inicial (%)</text>`;
  document.getElementById(id).innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="COS relativo por área">${g}</svg>`;
  document.getElementById('cmpleg').innerHTML=S_.map((q,i)=>`<span><i style="background:${CCOL[i%4]}"></i>${q.n}</span>`).join('')+'<span>cenário base, mesma rotação e premissas</span>';
}
/* ---------- slides ---------- */
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const dC=B.checagem.toc_fim-B.checagem.toc0, nFinal=NSO[1][nm]-S.n_estoque;
const balTot=B.serie[nm-1].bal_n, balLo=LO.serie[nm-1].bal_n, balHi=HI.serie[nm-1].bal_n;
const anos=M.meses_total/12;
const tag='<span class="tag">CENÁRIO [hip]/[mod] · NÃO É PREVISÃO</span>';
const SL=[];
SL.push(`<div class="wrap hero"><p>${tag}</p><h1>Carbono e nitrogênio do solo<br>ao longo de 14 culturas</h1>
<p class="muted" style="font-size:1.15em;max-width:46ch">Rotação sequencial em ${M.local} (${fmt(M.lat,2)}, ${fmt(M.lon,2)}), ${fmt(anos,1)} anos, simulada com RothC (C) e um balanço simples de N. Troque de área no seletor do canto inferior: Cascavel-PR, Franca-SP, Varginha-MG e Ariquemes-RO.</p>
<div class="note" style="max-width:62ch;margin-top:18px"><b>Leia isto antes dos gráficos.</b> O estoque inicial vem do SoilGrids (estimativa de satélite e modelo, não análise de laboratório). Os aportes de resíduo, a fixação biológica e as exportações por cultura <b>não têm fonte na pesquisa</b>: são hipóteses de trabalho, marcadas como [hip]. As curvas mostram o que o modelo faz com essas hipóteses.</div></div>`);
SL.push(`<div class="wrap"><h3>Ponto de partida</h3><h2>Solo e clima de ${M.local}</h2>
<div class="grid g4" style="margin:14px 0">
<div class="card"><div class="muted">Carbono orgânico, 0–30 cm</div><div class="big">${fmt(S.toc,0)} <span class="unit">t C/ha</span></div><div class="muted">${fmt(S.soc_gkg,1)} g/kg · Ds ${fmt(S.ds,2)} kg/dm³</div></div>
<div class="card"><div class="muted">Nitrogênio total, 0–30 cm</div><div class="big">${fmt(S.n_estoque,1)} <span class="unit">t N/ha</span></div><div class="muted">${fmt(S.n_gkg,2)} g/kg</div></div>
<div class="card"><div class="muted">Relação C:N do solo</div><div class="big">${fmt(S.cn,1)}</div><div class="muted">fixa na simulação [hip]</div></div>
<div class="card"><div class="muted">Argila</div><div class="big">${fmt(S.argila_pct,0)} <span class="unit">%</span></div><div class="muted">controla a umidade e a divisão BIO/HUM</div></div></div>
<div class="grid g2"><div class="card"><h3>Clima mensal médio (NASA POWER, ${M.clima.anos[0]}–${M.clima.anos[1]})</h3><div class="chart" id="clim"></div>
<div class="legend"><span><i style="background:var(--com)"></i>chuva (mm)</span><span><i style="background:var(--warn)"></i>ETo FAO-56 (mm)</span><span><i style="background:var(--accent)"></i>temperatura (°C)</span></div>
<p class="muted">Chuva ${fmt(sum(M.clima.chuva,x=>x),0)} mm/ano · ETo ${fmt(sum(M.clima.eto,x=>x),0)} mm/ano · T média ${fmt(sum(M.clima.tmean,x=>x)/12,1)} °C.</p></div>
<div class="card"><h3>De onde vêm os números</h3><ul class="tight"><li><b>SoilGrids 2.0</b> pelo WCS público do ISRIC (sem credenciais), média dos pixels com dado numa área de ~${fmt(S.lado_m*S.lado_m/1e4,0)} ha, camadas 0–5, 5–15 e 15–30 cm, ponderadas pela espessura.</li><li><b>Cobertura parcial:</b> o WCS devolveu poucos pixels válidos (mínimo de ${S.pixels_min} por camada). Em Cascavel, a mesma consulta difere do Earth Engine em até ~2% (COS, argila, Ds, pH e CTC).</li><li>Conversão: C ÷10, argila ÷10, Ds ÷100 e <b>N ÷100</b> (unidade oficial, cg/kg). O asset do Earth Engine vem ×10 e usa ÷1000; os dois dão o mesmo N.</li><li>Local = centro do município (${fmt(M.lat,2)}, ${fmt(M.lon,2)}), não uma lavoura específica.</li><li>Estoque (t/ha) = teor (g/kg) × Ds (kg/dm³) × espessura (cm) × 0,1.</li><li><b>Provisório:</b> valores obtidos por consulta ao Earth Engine fora da <code>space</code>; serão substituídos pela consulta feita na própria <code>space</code>.</li></ul></div></div></div>`);
SL.push(`<div class="wrap"><h3>Modelo e premissas</h3><h2>O que é verificado e o que é hipótese</h2>
<div class="grid g2" style="margin-bottom:14px"><div class="card"><h3>Verificado na pesquisa [ref]</h3><ul class="tight"><li>RothC: k (ano⁻¹) DPM ${M.rothc_const.k_ano.DPM} · RPM ${M.rothc_const.k_ano.RPM} · BIO ${M.rothc_const.k_ano.BIO} · HUM ${M.rothc_const.k_ano.HUM}</li><li>DPM/RPM de resíduo agrícola = ${M.rothc_const.razao_dpm_rpm_residuo}; produtos em BIO:HUM = 46:54</li><li>IOM = 0,049·COS^1,139 = ${fmt(M.iom,1)} t C/ha</li></ul></div>
<div class="card"><h3>Hipótese ou estimativa</h3><ul class="tight"><li>Aportes de C, C:N dos resíduos, FBN e exportação de N por cultura (tabela abaixo)</li><li>Solo sempre coberto (fator 0,6) e ETo no lugar de 0,75 × evaporação de tanque [est]</li><li>N do solo acompanha o C com C:N constante</li><li>Sem adubação nitrogenada nem calagem</li></ul></div></div>
<div class="card" style="padding:8px 10px"><table><thead><tr><th>#</th><th>Cultura</th><th>Tipo</th><th class="n">Meses</th><th class="n">C resíduo (t/ha)</th><th class="n">C:N resíduo</th><th class="n">FBN (kg N/ha)</th><th class="n">Exportação N (kg/ha)</th></tr></thead><tbody>
${M.premissas.map((p,i)=>`<tr><td>${i+1}</td><td>${p.nome}${LEG.has(p.nome)?' <span class="leg">●</span>':''}</td><td><span class="pill ${p.tipo==='comercial'?'com':'cob'}">${p.tipo}</span></td><td class="n">${p.meses}</td><td class="n">${fmt(p.c_residuo,1)}</td><td class="n">${p.cn_residuo}</td><td class="n">${p.fbn}</td><td class="n">${p.export_n}</td></tr>`).join('')}</tbody></table></div>
<p class="muted" style="margin-top:8px">● leguminosa (fixa N). Cenários baixo/base/alto multiplicam o aporte de C e a FBN por ${M.cenarios.baixo} / ${M.cenarios.base} / ${M.cenarios.alto}; a exportação não muda.</p></div>`);
SL.push(`<div class="wrap"><h3>Linha do tempo</h3><h2>As 14 culturas em sequência: ${fmt(anos,1)} anos</h2><div class="card" id="tl" style="padding:18px"></div>
<div class="legend" style="margin-top:10px"><span><i style="background:var(--com)"></i>comercial</span><span><i style="background:var(--cob)"></i>cobertura</span><span><span class="leg">●</span> leguminosa</span></div>
<p class="muted" style="margin-top:14px">A ordem alterna comerciais e coberturas, é a <b>mesma em todas as áreas</b> e é uma <b>proposta</b> [hip], editável em <code>premissas.yaml</code>. Cana-de-açúcar e café entram como um ciclo de 12 meses cada, o que simplifica culturas semiperene e perene. A duração de cada etapa também é hipótese.</p></div>`);
SL.push(`<div class="wrap"><h3>Carbono orgânico, 0–30 cm</h3><h2>COS vai de ${fmt(S.toc,1)} a ${fmt(B.checagem.toc_fim,1)} t C/ha no cenário base (${sgn(dC,1)})</h2>
<div class="chart card" id="cC"></div>
<div class="legend"><span><i style="background:var(--accent)"></i>cenário base</span><span><i style="background:var(--band);height:10px"></i>faixa baixo–alto</span><span><i style="background:var(--warn)"></i>estoque inicial</span></div>
<div class="note" style="margin-top:12px"><b>Por que cai em todos os cenários:</b> para sustentar ${fmt(S.toc,0)} t C/ha neste clima, o RothC precisa de <b>${fmt(M.aporte_equilibrio_t_c_ha_ano,1)} t C/ha/ano</b> de aporte; as hipóteses somam só <b>${fmt(B.checagem.aporte_medio_ano,1)}</b> (base). Com o aporte de equilíbrio o estoque fica estável (deriva ${sgn(V.deriva_pct,1)}% em ${fmt(anos,1)} anos). Ou seja, a queda mostra o descompasso entre estoque inicial e aporte assumido, <b>não</b> que essa rotação esgota o solo.</div></div>`);
SL.push(`<div class="wrap"><h3>Nitrogênio</h3><h2>Dois olhares: N no solo e balanço aparente</h2>
<div class="grid g2"><div class="card"><h3>N total do solo (acoplado ao C)</h3><div class="chart" id="cN"></div><p class="muted">N total = COS ÷ C:N (${fmt(S.cn,1)}, fixo). Por isso o formato repete o do carbono: ${fmt(S.n_estoque,2)} → ${fmt(NSO[1][nm],2)} t N/ha (${sgn(nFinal*1000,0)} kg N/ha). Não é um modelo independente de N.</p></div>
<div class="card"><h3>Balanço aparente: FBN − exportação (kg N/ha acumulado)</h3><div class="chart" id="cB"></div><p class="muted">Sem adubação nitrogenada. Base: ${sgn(balTot,0)} kg N/ha em ${fmt(anos,1)} anos (faixa ${sgn(Math.min(balLo,balHi),0)} a ${sgn(Math.max(balLo,balHi),0)}). Negativo significa que a fixação não cobre o que sai nos grãos.</p></div></div></div>`);
SL.push(`<div class="wrap"><h3>Contribuição por cultura</h3><h2>Quem soma e quem tira em cada etapa</h2>
<div class="grid g2"><div class="card"><div class="chart" id="bC"></div></div><div class="card"><div class="chart" id="bN"></div></div></div>
<p class="muted" style="margin-top:10px">Barras: cenário base. Traço: faixa baixo–alto. À esquerda, variação do COS na etapa; à direita, FBN − exportação de N. Ordem e tamanho das etapas influenciam os valores: etapas longas (cana, café) acumulam mais.</p></div>`);
SL.push(`<div class="wrap"><h3>Comparação entre as áreas</h3><h2>Mesma rotação, solos e climas diferentes</h2>
<div class="card" style="padding:8px 10px;overflow:auto"><table><thead><tr><th>Área</th><th class="n">Argila (%)</th><th class="n">COS 0–30 (t C/ha)</th><th class="n">N total (t N/ha)</th><th class="n">Chuva (mm/ano)</th><th class="n">T média (°C)</th><th class="n">ETo (mm/ano)</th><th class="n">Aporte p/ equilíbrio (t C/ha/ano)</th><th class="n">COS final, base (t C/ha)</th><th class="n">Δ COS (%)</th><th class="n">FBN − exp. (kg N/ha)</th></tr></thead><tbody>
${ALL.ordem.map(k=>{const c=ALL.cidades[k],m=c.meta,s_=m.solo,b=c.cenarios.base,ck=b.checagem;return `<tr${k===KEY?' style="font-weight:700"':''}><td>${m.local}</td><td class="n">${fmt(s_.argila_pct,0)}</td><td class="n">${fmt(s_.toc,1)}</td><td class="n">${fmt(s_.n_estoque,2)}</td><td class="n">${fmt(sum(m.clima.chuva,x=>x),0)}</td><td class="n">${fmt(sum(m.clima.tmean,x=>x)/12,1)}</td><td class="n">${fmt(sum(m.clima.eto,x=>x),0)}</td><td class="n">${fmt(m.aporte_equilibrio_t_c_ha_ano,1)}</td><td class="n">${fmt(ck.toc_fim,1)}</td><td class="n">${sgn(100*(ck.toc_fim-ck.toc0)/ck.toc0,1)}</td><td class="n">${sgn(b.serie[b.serie.length-1].bal_n,0)}</td></tr>`}).join('')}</tbody></table></div>
<div class="card chart" id="cmp" style="margin-top:14px"></div>
<div class="legend" id="cmpleg"></div>
<div class="note" style="margin-top:12px"><b>Como ler:</b> a rotação, os aportes e as premissas são <b>idênticos</b>; só mudam solo e clima. As diferenças de queda vêm de quanto aporte cada solo exigiria para ficar em equilíbrio. Culturas como trigo, café e cana podem não ser viáveis em todas as áreas (por exemplo, trigo na Amazônia); o ZARC não foi aplicado.</div></div>`);
SL.push(`<div class="wrap"><h3>Limites</h3><h2>O que esta simulação não sustenta</h2>
<div class="grid g2"><div class="card"><ul class="tight"><li><b>Sem aportes verificados.</b> A pesquisa não tem t C/ha de resíduo, C:N, FBN nem exportação por cultura. Tudo isso é [hip].</li><li><b>Clima de grade grosseira.</b> NASA POWER (~0,5°) pode subestimar a chuva; aqui dá ${fmt(sum(M.clima.chuva,x=>x),0)} mm/ano e não foi conferido com estações (INMET).</li><li><b>Estoque inicial estimado.</b> SoilGrids tem incerteza por pixel, e o estoque de ${fmt(S.toc,0)} t C/ha não é consistente com os aportes assumidos.</li><li><b>N sem modelo próprio.</b> Classe C da pesquisa: o N segue o C por C:N fixo; não há mineralização, perdas nem imobilização.</li><li><b>RothC fora da sua origem.</b> Validações brasileiras pontuais; escopo regional não verificado.</li></ul></div>
<div class="card"><ul class="tight"><li><b>Só COS e N.</b> Densidade, porosidade e resistência à penetração não entram (sem equação validada de recuperação).</li><li><b>Sem causalidade.</b> Não se atribui à cultura efeito na produtividade seguinte.</li><li><b>Sem ZARC e sem clima futuro.</b> Janelas de plantio e mudança climática não foram aplicadas.</li><li><b>Sem adubação, calagem ou preparo do solo.</b></li></ul></div></div></div>`);
SL.push(`<div class="wrap"><h3>Próximos passos</h3><h2>Do cenário a algo defensável</h2>
<div class="grid g3"><div class="card"><h3>1 · Estoque inicial</h3><p>Usar as coordenadas da lavoura (não do centro do município) e comparar o SoilGrids com análise de solo de laboratório.</p></div>
<div class="card"><h3>2 · Aportes por cultura</h3><p>Substituir as hipóteses por valores de literatura regional ou do Manual de adubação do Paraná, com fonte e faixa.</p></div>
<div class="card"><h3>3 · Calibrar</h3><p>Ajustar o RothC com séries locais de COS sob plantio direto e rever a relação C:N do solo.</p></div>
<div class="card"><h3>4 · N de verdade</h3><p>Trocar o acoplamento por C:N por um modelo de N (por exemplo, DSSAT-CENTURY ou APSIM).</p></div>
<div class="card"><h3>5 · Janelas</h3><p>Aplicar o ZARC por município e as temperaturas cardeais para a ordem e as datas da rotação.</p></div>
<div class="card"><h3>6 · Incerteza</h3><p>Trocar o fator único baixo/alto por Monte Carlo sobre cada premissa.</p></div></div>
<p class="muted" style="margin-top:16px">Premissas editáveis em <code>/opt/projeto/teste2/apresentacao/premissas.yaml</code>; rodar <code>modelo.py</code> e <code>build_html.py</code> regenera esta apresentação.</p></div>`);

/* ---------- montagem ---------- */
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
SL.forEach((h,i)=>{const s=document.createElement('section');s.innerHTML=h;deck.appendChild(s);const d=document.createElement('span');d.title='Slide '+(i+1);d.onclick=()=>go(i);dots.appendChild(d)});
// linha do tempo
(function(){const tot=M.meses_total;document.getElementById('tl').innerHTML=`<div style="display:flex;gap:3px;height:86px">${slots.map(s=>`<div title="${s.cultura}: ${s.meses} meses" style="flex:${s.meses};background:${col(s.tipo)};border-radius:7px;display:flex;align-items:flex-end;justify-content:center;padding:4px 2px;color:#fff;font-size:.72rem;font-weight:600;overflow:hidden;min-width:0"><span style="writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap">${s.cultura}${LEG.has(s.cultura)?' ●':''}</span></div>`).join('')}</div>
<div style="display:flex;justify-content:space-between;margin-top:8px" class="muted"><span>mês 0</span><span>ano 2</span><span>ano 4</span><span>ano 6</span><span>mês ${tot}</span></div>`})();
let cur=-1,drawn={};
function draw(i){if(drawn[i])return;drawn[i]=1;
  if(i===1)climChart('clim');
  if(i===4)lineChart('cC',{series:TOC.map(ys=>({ys})),yLabel:'COS 0–30 cm (t C/ha)',dec:1,hline:{y:S.toc,label:'estoque inicial'}});
  if(i===5){lineChart('cN',{series:NSO.map(ys=>({ys})),yLabel:'N total (t N/ha)',dec:2,W:560,H:340,compact:true});lineChart('cB',{series:BAL.map(ys=>({ys})),yLabel:'FBN − exportação (kg N/ha)',dec:0,hline:{y:0,label:'zero'},W:560,H:340,compact:true})}
  if(i===7)relLines('cmp');
  if(i===6){const mk=(k)=>slots.map((s,j)=>{const a=LO.slots[j][k],b=HI.slots[j][k];return{n:s.cultura,tipo:s.tipo,v:s[k],lo:Math.min(a,b),hi:Math.max(a,b)}});
    barChart('bC',{rows:mk('delta_c'),dec:2,title:'Δ COS na etapa (t C/ha)'});barChart('bN',{rows:mk('balanco_n'),dec:0,title:'FBN − exportação (kg N/ha)'})}
}
function go(i){i=Math.max(0,Math.min(SL.length-1,i));if(i===cur)return;cur=i;
  deck.querySelectorAll('section').forEach((s,k)=>s.classList.toggle('on',k===i));
  dots.querySelectorAll('span').forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('cnt').textContent=(i+1)+' / '+SL.length;deck.querySelectorAll('section')[i].scrollTop=0;
  draw(i);try{history.replaceState(null,'','#'+KEY+'-'+(i+1))}catch(e){}}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(SL.length-1)});
document.getElementById('theme').onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue('--bg').trim()==='#101614';r.setAttribute('data-theme',dk?'light':'dark')};
const sel=document.getElementById('city');
ALL.ordem.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=ALL.cidades[k].meta.local;if(k===KEY)o.selected=true;sel.appendChild(o)});
sel.onchange=()=>{location.hash=sel.value+'-'+(cur+1);location.reload()};
go(Math.max(0,(HM?+HM[2]:(parseInt(location.hash.slice(1))||1))-1));
</script>
</body>
